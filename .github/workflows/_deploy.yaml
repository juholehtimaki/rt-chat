name: Deploy

on:
  workflow_call:
    inputs:
      aws_account_id:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      domain_name:
        required: true
        type: string
      hosted_zone_name:
        required: true
        type: string
      firebase_project_id:
        required: true
        type: string
      firebase_api_key:
        required: true
        type: string
      firebase_app_id:
        required: true
        type: string
      firebase_messaging_sender_id:
        required: true
        type: string
      firebase_measurement_id:
        required: true
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true

jobs:
  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          VITE_FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_project_id }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ inputs.firebase_project_id }}.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.firebase_messaging_sender_id }}
          VITE_FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ inputs.firebase_measurement_id }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/GitHubActionsRole

      - name: CDK deploy
        run: cd infra && pnpm cdk deploy --all --require-approval never
        env:
          DOMAIN_NAME: ${{ inputs.domain_name }}
          HOSTED_ZONE_NAME: ${{ inputs.hosted_zone_name }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}

  firebase:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy Firestore rules
        uses: w9jds/firebase-action@v15.15.0
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
