name: Push Main

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  qa:
    name: QA
    uses: ./.github/workflows/_qa.yaml
    with:
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      aws_region: ${{ vars.AWS_REGION }}
      domain_name: ${{ vars.DOMAIN_NAME }}
      hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      firebase_api_key: ${{ vars.FIREBASE_API_KEY }}
      firebase_app_id: ${{ vars.FIREBASE_APP_ID }}
      firebase_messaging_sender_id: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      firebase_measurement_id: ${{ vars.FIREBASE_MEASUREMENT_ID }}

  deploy:
    name: Deploy
    needs: qa
    uses: ./.github/workflows/_deploy.yaml
    with:
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      aws_region: ${{ vars.AWS_REGION }}
      domain_name: ${{ vars.DOMAIN_NAME }}
      hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
      firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      firebase_api_key: ${{ vars.FIREBASE_API_KEY }}
      firebase_app_id: ${{ vars.FIREBASE_APP_ID }}
      firebase_messaging_sender_id: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      firebase_measurement_id: ${{ vars.FIREBASE_MEASUREMENT_ID }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
